name: Release

# Cut a release without touching version numbers by hand: run this workflow, enter the version
# (e.g. 1.4), and it bumps versionCode/versionName + CHANGELOG.md, commits that with [skip ci],
# tags it, builds the APK from that commit, and publishes the GitHub Release.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 1.4 (no leading v)"
        required: true
      notes:
        description: "Release notes, one per line (optional; defaults to commit subjects since the last tag)"
        required: false

permissions:
  contents: write

jobs:
  release:
    name: Bump, build, and publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve and validate version
        id: v
        env:
          RAW_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          VERSION="${RAW_VERSION#v}"
          if ! echo "$VERSION" | grep -qE '^[0-9]+(\.[0-9]+)+$'; then
            echo "::error::Invalid version '$VERSION' (expected e.g. 1.4)"; exit 1
          fi
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "::error::Tag v$VERSION already exists"; exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Bump version and changelog
        env:
          VERSION: ${{ steps.v.outputs.version }}
          NOTES: ${{ github.event.inputs.notes }}
        run: |
          set -euo pipefail
          GRADLE=app/build.gradle.kts

          # Derive versionCode from the version itself (major*10000 + minor*100 + patch), so it is
          # a deterministic function of the tag rather than a stateful +1. Stays monotonic as long
          # as versions increase.
          IFS='.' read -r MAJOR MINOR PATCH _ <<< "$VERSION"
          NEW_CODE=$(( ${MAJOR:-0} * 10000 + ${MINOR:-0} * 100 + ${PATCH:-0} ))
          CURRENT_CODE=$(grep -oE 'versionCode = [0-9]+' "$GRADLE" | grep -oE '[0-9]+')
          if [ "$NEW_CODE" -le "$CURRENT_CODE" ]; then
            echo "::error::versionCode $NEW_CODE (from $VERSION) is not greater than current $CURRENT_CODE — Android can't install a lower versionCode. Release a higher version."
            exit 1
          fi
          sed -i -E "s/versionCode = [0-9]+/versionCode = ${NEW_CODE}/" "$GRADLE"
          sed -i "s/^val appVersionName = \".*\"/val appVersionName = \"${VERSION}\"/" "$GRADLE"

          {
            echo "## ${VERSION}"
            if [ -n "$(printf '%s' "$NOTES" | tr -d '[:space:]')" ]; then
              printf '%s\n' "$NOTES" | sed '/^[[:space:]]*$/d' | sed 's/^[[:space:]]*-\{0,1\}[[:space:]]*//' | sed 's/^/- /'
            else
              LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || true)
              if [ -n "$LAST_TAG" ]; then
                git log "${LAST_TAG}..HEAD" --no-merges --pretty='- %s' | grep -v '\[skip ci\]' || echo "- Maintenance release"
              else
                echo "- Maintenance release"
              fi
            fi
            echo
          } > /tmp/section.md

          awk 'NR==1 && /^# / {print; print ""; while ((getline line < "/tmp/section.md") > 0) print line; close("/tmp/section.md"); next} {print}' CHANGELOG.md > /tmp/CHANGELOG.md
          mv /tmp/CHANGELOG.md CHANGELOG.md

          echo "Bumped versionCode ${CURRENT_CODE} -> ${NEW_CODE}, versionName -> ${VERSION}"

      - name: Commit, tag, and push
        env:
          TAG: ${{ steps.v.outputs.tag }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle.kts CHANGELOG.md
          git commit -m "Release ${VERSION} [skip ci]"
          git tag "$TAG"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          git push origin "$TAG"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Rename APK
        env:
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/kettlebell-${TAG}.apk"

      - name: Extract release notes
        env:
          VERSION: ${{ steps.v.outputs.version }}
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          awk -v ver="## ${VERSION}" '
            $0 == ver { cap = 1; next }
            /^## / { if (cap) exit }
            cap { print }
          ' CHANGELOG.md > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "Kettlebell ${TAG}" > release_notes.md
          fi
          echo "----- release notes -----"
          cat release_notes.md

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.v.outputs.tag }}
          name: Kettlebell ${{ steps.v.outputs.tag }}
          body_path: release_notes.md
          files: dist/kettlebell-${{ steps.v.outputs.tag }}.apk
          fail_on_unmatched_files: true
