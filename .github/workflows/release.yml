name: Release

# Push a tag like `v1.4` to cut a release — no manual input, no hand-editing versions.
# The workflow releases the current tip of the default branch as that version: it derives
# versionName/versionCode from the tag, updates CHANGELOG.md, commits that with [skip ci],
# builds the APK from that commit, and publishes the GitHub Release with the APK attached.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve version from tag
        id: v
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG_NAME#v}"
          if ! echo "$VERSION" | grep -qE '^[0-9]+(\.[0-9]+)+$'; then
            echo "::error::Tag '$TAG_NAME' -> version '$VERSION' is not a valid version (expected e.g. v1.4)"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG_NAME" >> "$GITHUB_OUTPUT"

      - name: Bump version and changelog
        env:
          VERSION: ${{ steps.v.outputs.version }}
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          set -euo pipefail
          GRADLE=app/build.gradle.kts

          # versionCode is a deterministic function of the tag version (major*10000 + minor*100
          # + patch), so v1.4 -> 10400. Stays monotonic as long as versions increase.
          IFS='.' read -r MAJOR MINOR PATCH _ <<< "$VERSION"
          NEW_CODE=$(( ${MAJOR:-0} * 10000 + ${MINOR:-0} * 100 + ${PATCH:-0} ))
          CURRENT_CODE=$(grep -oE 'versionCode = [0-9]+' "$GRADLE" | grep -oE '[0-9]+')
          if [ "$NEW_CODE" -le "$CURRENT_CODE" ]; then
            echo "::error::versionCode $NEW_CODE (from $VERSION) is not greater than current $CURRENT_CODE — Android can't install a lower versionCode. Tag a higher version."
            exit 1
          fi
          sed -i -E "s/versionCode = [0-9]+/versionCode = ${NEW_CODE}/" "$GRADLE"
          sed -i "s/^val appVersionName = \".*\"/val appVersionName = \"${VERSION}\"/" "$GRADLE"

          # Update CHANGELOG.md unless this version's section was already written by hand.
          if grep -qE "^## ${VERSION}( |\$)" CHANGELOG.md; then
            echo "CHANGELOG already has a ## ${VERSION} section; keeping it."
          else
            PREV_TAG=$(git describe --tags --abbrev=0 --exclude "$TAG" HEAD 2>/dev/null || true)
            {
              echo "## ${VERSION}"
              if [ -n "$PREV_TAG" ]; then
                git log "${PREV_TAG}..HEAD" --no-merges --pretty='- %s' \
                  | grep -vE '\[skip ci\]|^- Release ' || echo "- Maintenance release"
              else
                git log --no-merges --pretty='- %s' \
                  | grep -vE '\[skip ci\]|^- Release ' || echo "- Maintenance release"
              fi
              echo
            } > /tmp/section.md
            awk 'NR==1 && /^# / {print; print ""; while ((getline line < "/tmp/section.md") > 0) print line; close("/tmp/section.md"); next} {print}' CHANGELOG.md > /tmp/CHANGELOG.md
            mv /tmp/CHANGELOG.md CHANGELOG.md
          fi

          echo "versionCode -> ${NEW_CODE}, versionName -> ${VERSION}"

      - name: Commit the release bump into the default branch
        env:
          VERSION: ${{ steps.v.outputs.version }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle.kts CHANGELOG.md

          if git diff --cached --quiet; then
            echo "No version/changelog changes to commit — ${DEFAULT_BRANCH} already reflects ${VERSION}."
            exit 0
          fi

          git commit -m "Release ${VERSION} [skip ci]"

          # Push the bump to the default branch, rebasing onto any concurrent changes so it always
          # lands. Fail loudly if it truly can't (e.g. branch protection blocks the bot) so the
          # release does not proceed without the version being recorded.
          pushed=false
          for attempt in 1 2 3 4 5; do
            if git push origin "HEAD:${DEFAULT_BRANCH}"; then
              pushed=true
              break
            fi
            echo "Push attempt ${attempt} failed; syncing with origin/${DEFAULT_BRANCH} and retrying."
            git fetch origin "${DEFAULT_BRANCH}"
            git rebase "origin/${DEFAULT_BRANCH}" || {
              echo "::error::Could not rebase the release bump onto ${DEFAULT_BRANCH}."
              exit 1
            }
            sleep $((attempt * 3))
          done

          if [ "$pushed" != "true" ]; then
            echo "::error::Failed to push the version bump to ${DEFAULT_BRANCH}. If ${DEFAULT_BRANCH} is protected, allow the github-actions bot to push (or bypass protection for it)."
            exit 1
          fi

          # Confirm the commit is actually on the remote default branch before releasing.
          git fetch origin "${DEFAULT_BRANCH}"
          if ! git merge-base --is-ancestor HEAD "origin/${DEFAULT_BRANCH}"; then
            echo "::error::Version bump commit is not on origin/${DEFAULT_BRANCH} after push."
            exit 1
          fi
          echo "Version bump $(git rev-parse --short HEAD) is on ${DEFAULT_BRANCH}."

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Rename APK
        env:
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/kettlebell-${TAG}.apk"

      - name: Extract release notes
        env:
          VERSION: ${{ steps.v.outputs.version }}
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          awk -v ver="## ${VERSION}" '
            $0 == ver { cap = 1; next }
            /^## / { if (cap) exit }
            cap { print }
          ' CHANGELOG.md > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "Kettlebell ${TAG}" > release_notes.md
          fi
          echo "----- release notes -----"
          cat release_notes.md

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.v.outputs.tag }}
          name: Kettlebell ${{ steps.v.outputs.tag }}
          body_path: release_notes.md
          files: dist/kettlebell-${{ steps.v.outputs.tag }}.apk
          fail_on_unmatched_files: true
